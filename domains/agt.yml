# OCRDb domain file — PRE-1.0: no domain is ratified until 1.0; this domain's lifecycle stage is derived, not stored here — see RATIFICATION.md.
domain: AGT
name: agentic-trust
areas:
  A:
    name: prompt-injection-surfaces
    categories:
      '1': injection-channels
  B:
    name: tool-and-permission-scoping
    categories:
      '1': authority-scope
  C:
    name: output-trust-boundaries
    categories:
      '1': unverified-trust
  D:
    name: autonomy-and-oversight
    categories:
      '1': verifier-and-action-integrity
  E:
    name: resource-and-cost-safety
    categories:
      '1': budget-and-loops
  F:
    name: data-egress
    categories:
      '1': provider-egress
entries:
  AGT-A1A:
    name: indirect-prompt-injection-untrusted-content-in-agent-context
    default_severity: HIGH
    status: active
    provenance:
    - corpus
    recurrence: 4
    cwe:
    - CWE-1427
    examples:
    - Reviewer agent prompt templates never tell the model that reviewed file content is untrusted
    - Advisor prompt embeds an unfiltered agent-authored finding JSON, opening an indirect-prompt-injection channel
    criteria: >-
      Qualifies when indirect prompt injection is DEMONSTRATED — untrusted
      content reaches the agent context AND provably attempts to steer the
      agent (an injection payload / instruction-like content aimed at the
      model), not merely present. The evidentiary bar is shown steering intent
      or effect. Untrusted content that reaches the context WITHOUT
      demonstrated steering is the exposure precursor AGT-A1B. Mitigations that
      neutralise the steering — delimiter/where-escaping, quoting untrusted
      content, output fencing — demote an instance toward AGT-A1B or justify a
      consumer severity_modifier (`compensating-control-present`).
    see_also:
    - AGT-A1B
  AGT-A1B:
    name: untrusted-content-in-agent-context
    default_severity: MEDIUM
    status: active
    provenance:
    - prior-art
    - gap-review
    cwe:
    - CWE-1427
    criteria: >-
      Qualifies when untrusted content REACHES the agent's context (a
      prompt-injection exposure/precursor) but no steering of the agent is
      demonstrated. When steering is demonstrated (an actual injection attempt
      or effect), that is AGT-A1A per its evidentiary bar.
    see_also:
    - AGT-A1A
  AGT-B1A:
    name: incomplete-mediation-coverage-gap
    default_severity: HIGH
    status: active
    provenance:
    - corpus
    recurrence: 2
    cwe:
    - CWE-863
    - CWE-284
    examples:
    - Write-guard covers only Write/Edit/NotebookEdit tool_name calls
    criteria: >-
      Qualifies when a mediation/enforcement mechanism EXISTS but fails to cover a
      class of invocations — a coverage gap in the control itself (e.g. a
      write-guard that gates Write/Edit but not Bash). Axis: an
      existing-but-incomplete control is always B1A; where NO control mediates the
      action, route by what is absent — missing human approval on a destructive
      action is B1B, absent scope bounds on a write-capable tool is B1C, and an
      over-broad grant of tools beyond the task is B1D. A control that runs but
      mis-parses an undocumented input shape is instead ARC-F2C. Severity is
      graded by the CAPABILITY of the ungated invocation class, not the mere
      existence of the gap: HIGH when that class can write, execute, or
      exfiltrate (an ungated Bash/Edit/Write, or any path to un-adjudicated
      egress); MEDIUM when the ungated class is read-only and its output is
      adjudicated — e.g. a review scope-fence constraining Read/Grep/Glob only,
      with no write/exec/egress channel — especially where the gap is disclosed.
    see_also:
    - AGT-B1B
    - AGT-B1C
    - AGT-B1D
    - ARC-F2C
  AGT-B1B:
    name: missing-approval-gate-for-destructive-action
    default_severity: HIGH
    status: active
    provenance:
    - prior-art
    - gap-review
    cwe:
    - CWE-862
    criteria: >-
      Qualifies when a destructive or irreversible action executes with NO human
      approval checkpoint at all, regardless of scoping — the gate is absent, not
      merely incomplete. If a mediating control exists but has a coverage gap, that
      is AGT-B1A; if the defect is a write tool lacking scope bounds, AGT-B1C; if
      it is too many tools granted, AGT-B1D.
    see_also:
    - AGT-B1A
    - AGT-B1C
    - AGT-B1D
  AGT-B1C:
    name: unscoped-write-authority
    default_severity: HIGH
    status: active
    provenance:
    - prior-art
    - gap-review
    cwe:
    - CWE-284
    criteria: >-
      Qualifies when a granted write-capable tool can act OUTSIDE its intended
      scope (path/namespace/repo/tenant) — scope is absent, not merely broad. If
      instead the grant includes more tools than the task needs (breadth), that is
      AGT-B1D; if a mediating control exists but misses a class of invocations,
      AGT-B1A; if a destructive action has no approval gate at all, AGT-B1B.
    see_also:
    - AGT-B1A
    - AGT-B1B
    - AGT-B1D
  AGT-B1D:
    name: overbroad-tool-grant
    default_severity: MEDIUM
    status: active
    provenance:
    - prior-art
    - gap-review
    cwe:
    - CWE-269
    criteria: >-
      Qualifies when the granted tool SET exceeds what the declared task requires
      (breadth of grant), even if each tool is individually scoped. If a single
      write tool lacks scope bounds (can act outside its intended path/tenant),
      that is AGT-B1C; if a destructive action has no approval checkpoint, AGT-B1B;
      if an existing mediation control has a coverage gap, AGT-B1A.
    see_also:
    - AGT-B1A
    - AGT-B1B
    - AGT-B1C
  AGT-C1A:
    name: self-asserted-trust-metadata-spoofing
    default_severity: HIGH
    status: active
    provenance:
    - corpus
    recurrence: 9
    cwe:
    - CWE-290
    - CWE-345
    - CWE-807
    examples:
    - Self-asserted corroborated/corroborated_by fields bypass agent-trust sanitization and forge cross-panel verification
    - Self-asserted source/reinforced fields let an agent finding forge tool_confirmed evidence
    - Agent-authored `cvss`/`exploit_scenario` unconditionally overwrite a tool-verified finding's own metadata
    - Self-asserted `corroborated`/`corroborated_by` fields let an untrusted reviewer finding forge verification status
    - Self-asserted _group field can misattribute a finding to the wrong review group
    - corroborated/corroborated_by are self-assertable by agents even though the semantically-equivalent source/reinforced
      fields are explicitly stripped as forbidden, allowing spoofed cross-panel corroboration
  AGT-C1B:
    name: findings-from-undeclared-source-merged-despite-flagging
    default_severity: MEDIUM
    status: active
    provenance:
    - corpus
    recurrence: 2
    cwe:
    - CWE-693
    examples:
    - Findings from an undeclared/unexpected findings file are flagged in meta.integrity
  AGT-C1C:
    name: unauthenticated-external-data-rebuilds-trust-mapping
    default_severity: MEDIUM
    status: active
    provenance:
    - corpus
    recurrence: 3
    cwe:
    - CWE-345
    - CWE-290
    examples:
    - recover-linkage rebuilds the fingerprint-to-issue trust mapping from unauthenticated issue body text
    - Ledger recovery trusts unauthenticated GitHub issue-body content to rebuild the fingerprint-to-issue linkage
  AGT-C1D:
    name: unstructured-llm-output-trusted-for-control-decision
    default_severity: MEDIUM
    status: active
    provenance:
    - corpus
    recurrence: 1
    cwe:
    - CWE-345
    examples:
    - Advisor verdict ingestion trusts lenient, unauthenticated free-text LLM output
  AGT-D1A:
    name: agent-confabulated-action
    default_severity: HIGH
    status: active
    provenance:
    - corpus
  AGT-D1B:
    name: secret-materialized-into-agent-output
    default_severity: HIGH
    status: active
    provenance:
    - corpus
    cwe:
    - CWE-532
  AGT-D1C:
    name: single-verifier-unilateral-override-authority
    default_severity: MEDIUM
    status: active
    provenance:
    - corpus
    recurrence: 2
    cwe:
    - CWE-863
    examples:
    - Evidence model gives a single advisor-LLM verdict unilateral, uncorroborated power
  AGT-E1A:
    name: unbounded-agent-loop
    default_severity: HIGH
    status: active
    provenance:
    - prior-art
    - gap-review
    cwe:
    - CWE-834
  AGT-E1B:
    name: unbounded-tool-call-budget
    default_severity: MEDIUM
    status: active
    provenance:
    - prior-art
  AGT-F1A:
    name: sensitive-data-sent-to-model-provider
    default_severity: MEDIUM
    status: active
    provenance:
    - prior-art
    cwe:
    - CWE-200
