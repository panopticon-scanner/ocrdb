# OCRDb domain file — INCUBATING (pre-1.0; codes may change until the 1.0 freeze). See CHARTER.md.
domain: DAT
name: data-and-persistence
areas:
  A:
    name: schema-design
    categories:
      '1': integrity-and-modeling
  B:
    name: migrations
    categories:
      '1': safety-and-reversibility
  C:
    name: query-patterns
    categories:
      '1': efficiency-and-scale
  D:
    name: transactions-and-concurrency
    categories:
      '1': isolation-and-atomicity
  E:
    name: data-lifecycle
    categories:
      '1': retention-and-drift
  F:
    name: durable-file-and-local-state
    categories:
      '1': write-durability-and-atomicity
      '2': format-and-read-safety
entries:
  DAT-A1A:
    name: inappropriate-type-for-domain
    default_severity: MEDIUM
    status: active
    provenance:
    - prior-art
    - gap-review
    criteria: >-
      Qualifies for a per-row column whose declared type cannot represent or enforce
      the domain's value set (wrong width/precision, a type that can't hold a
      documented range). NOT for cross-row invariants (sum-to-zero, uniqueness — see
      DAT-A1B) nor a missing enum member of a state machine (that is a
      COD/state-machine defect). No corpus instance yet — prior-art only; enrich when
      observed.
  DAT-A1B:
    name: missing-constraint-for-invariant
    default_severity: MEDIUM
    status: active
    provenance:
    - prior-art
    - gap-review
    - corpus
    recurrence: 6
    examples:
    - Unique constraint enforced in app code but absent from schema (check-then-insert)
    - Spec invariant unique(org,slug) has no backing DB constraint
    - Domain membership invariant left as TODO, FK unenforced
    - Column type does not enforce documented value-range invariant
    criteria: >-
      Qualifies when an application-enforced invariant (uniqueness, range, membership)
      has no backing DB constraint, so a bypassing write path violates it. When the
      same check-then-insert locus could be cited as a race, PREFER A1B when the fix
      is the missing constraint; DAT-D1C when the finding is the exploitable race
      window.
  DAT-A1C:
    name: missing-foreign-key-relationship
    default_severity: MEDIUM
    status: active
    provenance:
    - prior-art
    - gap-review
    - corpus
    recurrence: 5
    examples:
    - Parent reference stored as bare UUID column with no foreign key
    - Join/counter table missing FK, orphans survive parent deletion
    - Spec'd FK implemented as plain column, no referential integrity
    - 'ORM belongs_to/dependent: :destroy with no DB-level FK or index'
    criteria: >-
      Qualifies when a logical parent reference is stored as a bare column with no
      foreign key, so orphan rows survive parent deletion and referential integrity is
      unenforced (including ORM belongs_to/dependent declarations with no DB-level
      FK).
  DAT-A1D:
    name: nullable-column-ambiguous-semantics
    default_severity: LOW
    status: active
    provenance:
    - prior-art
    - gap-review
    - corpus
    recurrence: 2
    examples:
    - Nullable column contradicts 'required' contract; NULL rows silently unqueryable
    - NULL overloaded as wildcard/global, conflating 'unset' with 'matches all'
    criteria: >-
      Qualifies when a nullable column's NULL has no single defined meaning —
      contradicting a 'required' contract (NULL rows silently unqueryable) or
      overloading NULL as a wildcard/'matches all' (conflating unset with global).
      Related mirror-image (a NOT NULL column filled with sentinel placeholders like
      'unknown') is noted for future coverage.
  DAT-B1A:
    name: destructive-migration-without-backfill
    default_severity: HIGH
    status: active
    provenance:
    - prior-art
    - gap-review
    - corpus
    recurrence: 8
    examples:
    - DELETE/TRUNCATE whole table to satisfy a new NOT NULL column, no backfill
    - DROP+re-ADD column resets stored values while paired data survives
    - Unconditional dropIfExists of production auth/token tables
    - Mass .update() overwrites per-user values with default, no backfill + noop reverse
    criteria: >-
      Qualifies when APPLYING the migration destroys existing production data that
      was not preserved or backfilled — data loss at deploy time. Precedence: when
      apply-time data loss and irreversibility coincide, code B1A (data loss
      outranks rollback impossibility). A migration with no working reverse path
      but no apply-time data loss is DAT-B1C; one that is unsafe to re-run is
      DAT-B1D. Grade by blast radius: a targeted cleanup of known-invalid rows is
      lower-severity than a whole-table wipe. Destructive RESTORE/backup or
      non-migration config rewrites are out of scope here (see DAT-F1A).
    see_also:
    - DAT-B1C
    - DAT-B1D
    - DAT-F1A
  DAT-B1B:
    name: table-lock-heavy-migration
    default_severity: HIGH
    status: active
    provenance:
    - prior-art
    - gap-review
    - corpus
    recurrence: 2
    examples:
    - Unbatched UPDATE over hot table inside one transaction holds row locks
    - ADD NOT NULL column with volatile default forces full-table rewrite under ACCESS EXCLUSIVE
    criteria: >-
      Qualifies when a migration holds heavy locks on a hot/large table — an
      unbatched mass UPDATE inside one transaction, or a DDL that forces a
      full-table rewrite under an exclusive lock (e.g. ADD NOT NULL with a
      volatile default). Severity assumes production concurrency; a
      single-writer/embedded target lowers it.
  DAT-B1C:
    name: irreversible-migration-no-rollback
    default_severity: MEDIUM
    status: active
    provenance:
    - prior-art
    - gap-review
    - corpus
    recurrence: 8
    examples:
    - Empty down()/pass downgrade leaves migration unrewindable
    - Rollback uses invalid SQL (DELETE TABLE), errors on execution
    - Forward-only migration runner with no reverse steps
    - Downgrade exists but is lossy — effectively irreversible
    criteria: >-
      Qualifies when the migration has no working reverse path — down() absent, a
      no-op, or untested — regardless of whether apply-time data loss occurs. If
      applying it also destroys un-backfilled production data, code DAT-B1A instead
      (data loss outranks irreversibility); if the defect is that re-running fails
      or double-applies, that is DAT-B1D. Also qualifies when a reverse path EXISTS
      but is unfaithful/lossy (drops columns/timestamps, over-drops rows) — 'has a
      downgrade, downgrade is wrong' is still effectively irreversible.
    see_also:
    - DAT-B1A
    - DAT-B1D
    - DAT-B1E
  DAT-B1D:
    name: non-idempotent-migration
    default_severity: MEDIUM
    status: active
    provenance:
    - prior-art
    - gap-review
    - corpus
    recurrence: 2
    examples:
    - Destructive step runs before idempotency marker is written; retry re-destroys
    - Data-rewrite migration double-applies on re-run (no current-shape guard)
    criteria: >-
      Qualifies when re-running the migration against an already-applied state
      fails or double-applies (re-run / idempotency safety, e.g. CREATE TABLE
      without IF NOT EXISTS) — often fully reversible and non-destructive, hence
      distinct. Apply-time data destruction is DAT-B1A; an absent or broken
      rollback path is DAT-B1C. Weight whether the migration runner already
      prevents re-application: if a re-run is only reachable by operator error,
      grade lower; if a destructive step precedes the idempotency marker (retry
      re-destroys) or a data rewrite double-applies, it qualifies at full
      severity.
    see_also:
    - DAT-B1A
    - DAT-B1C
    - DAT-B1F
  DAT-B1E:
    name: no-op-or-disabled-migration
    default_severity: MEDIUM
    status: active
    provenance:
    - corpus
    recurrence: 1
    examples:
    - immich migration up() fully commented out, occupies a version slot doing nothing
    criteria: >-
      Qualifies when a migration silently does nothing — an empty or
      commented-out up() body, or a migration excluded from the run — while
      permanently occupying a version slot, so the intended change is never
      applied and cannot be re-applied under that name. Distinct from DAT-B1A
      (destructive) and DAT-B1C (irreversible): B1E applies nothing at all.
    see_also:
    - DAT-B1C
  DAT-B1F:
    name: migration-error-swallowed-marked-applied
    default_severity: HIGH
    status: active
    provenance:
    - corpus
    recurrence: 3
    examples:
    - firefly-iii migration wraps DDL in catch(QueryException) and is still marked applied
    - Temporal changeset marked applied when a real failure's message matches 'already exist'
    - Beekeeper migration failure logged and skipped, leaving partial schema
    criteria: >-
      Qualifies when a migration wraps its DDL in a try/catch (or matches
      error-text substrings) and is recorded as applied despite the change
      failing, producing partial or absent schema that masquerades as migrated
      with no signal at deploy time. Distinct from DAT-B1D (non-idempotent =
      fails on RE-run) — B1F swallows the FIRST-run failure; and from SEC-F1B
      (generic silent-exception-swallowing) — B1F is migration-state-specific.
    see_also:
    - DAT-B1D
  DAT-C1A:
    name: missing-index-for-hot-query
    default_severity: MEDIUM
    status: active
    provenance:
    - prior-art
    - gap-review
    - corpus
    recurrence: 2
    examples:
    - Composite index absent for status-polling query on hot execution table
    - Append-only table lacks index on ts/event columns used by ORDER BY + WHERE
    criteria: >-
      Qualifies when a frequently-run read path (status polling, an append-only
      table's ORDER BY/WHERE reads) has no supporting index, forcing sequential
      scans. 'Hot' means called on a request/execution hot path or over an
      only-grows table — a rare admin call does not qualify.
  DAT-C1B:
    name: n-plus-one-query
    default_severity: MEDIUM
    status: active
    provenance:
    - prior-art
    - corpus
    recurrence: 6
    examples:
    - Collection count via len(lazy_relationship) instead of SQL COUNT
    - Per-row .get(pk=...) in serializer loop, no prefetch, on hot endpoint
    - Per-row update_attribute in find_each instead of update_all
    criteria: >-
      Qualifies for per-row queries issued in a loop instead of a set-based
      query — a count via len(lazy_relationship) instead of SQL COUNT, per-row
      .get()/update in a serializer or merge loop, a constant lookup re-queried
      per row.
    notes: moved from QAL-G1D at ratification
  DAT-C1C:
    name: unbounded-result-set
    default_severity: MEDIUM
    status: active
    provenance:
    - prior-art
    - gap-review
    - corpus
    recurrence: 6
    cwe:
    - CWE-770
    examples:
    - Query has no LIMIT/pagination; result grows unbounded with entity history
    - List endpoint returns full rows (incl heavy text column) with no pagination
    - .all() materializes entire table, filtered/sliced in application code
    criteria: >-
      Qualifies when a query has no LIMIT/pagination and its result grows
      unbounded with data (full list endpoints, .all() materializing a whole
      table, history that grows per event). Draw the boundary vs QAL-G2A: C1C is
      a DB query/result-set (the fix is SQL LIMIT/pagination); QAL-G2A is
      in-memory collection growth. Deliberate, bounded full-table
      exports/projections do NOT qualify. Non-RDBMS store scans (Redis
      keyspace, etcd prefix) that pull everything into memory DO qualify.
  DAT-C1D:
    name: select-star-in-production-path
    default_severity: LOW
    status: active
    provenance:
    - prior-art
    - gap-review
    - corpus
    recurrence: 2
    examples:
    - SELECT * across multiple production read helpers, pulls wide/body columns
    - Join selects entire JSON blob column instead of needed fields (TODO acknowledged)
    criteria: >-
      Qualifies for SELECT * (or fetching a whole wide/blob column) on a
      production read path where only some fields are needed. Often co-occurs
      with DAT-C1C; cite C1D when over-fetching columns is the defect, C1C when
      the unbounded row count is.
  DAT-D1A:
    name: isolation-level-mismatch
    default_severity: HIGH
    status: active
    provenance:
    - prior-art
    - gap-review
    criteria: >-
      Qualifies when a transaction's isolation level is wrong for its
      invariant (a read-modify-write needing SERIALIZABLE/row locks running
      at READ COMMITTED). Presupposes explicit multi-statement transactions
      with a settable isolation level; stores using advisory-lock + single
      atomic upsert give this no surface. No corpus instance yet — prior-art
      only; enrich when observed.
  DAT-D1B:
    name: missing-transaction-boundary
    default_severity: HIGH
    status: active
    provenance:
    - prior-art
    - gap-review
    - corpus
    recurrence: 10
    examples:
    - Multi-write merge across repositories with no surrounding transaction
    - Write runs on outer connection instead of the open transaction handle
    - Delete-then-recreate without transaction.atomic (IntegrityError swallowed)
    - Multi-row financial mutation with manual delete-on-error instead of a DB transaction
    criteria: >-
      Qualifies when related multi-statement writes that must be all-or-nothing
      run with no surrounding transaction (or a write runs on the outer
      connection instead of the open transaction handle), so a mid-sequence
      failure leaves partial state. Also covers loop-exit/cancellation paths
      that exit an open transaction without commit/rollback. A single
      non-transactional external side-effect leg lowers severity (no
      transactional fix available).
  DAT-D1C:
    name: read-modify-write-race
    default_severity: HIGH
    status: active
    provenance:
    - prior-art
    - gap-review
    - corpus
    recurrence: 3
    cwe:
    - CWE-362
    examples:
    - CAS on a stale/self-read revision instead of the caller's observed version
    - Read-modify-write toggle without row lock or optimistic locking
    - Read-decide-write across two separate transactions (once-guard runs twice)
    criteria: >-
      Qualifies for a read-modify-write in a DB/KV transaction with no row
      lock or optimistic-concurrency guard, so concurrent writers race. Scope
      note: a read-modify-write on a FLAT FILE belongs to DAT-F1C, not here.
      Also covers a broken/absent CAS (an optimistic WHERE version=? that
      binds a stale/zero version, or a blind last-writer-wins Update with no
      ResourceVersion) — same harm class as a transient race. When the same
      check-then-insert locus lacks a unique constraint, prefer DAT-A1B for
      the fix and D1C for the exploit.
    see_also:
    - DAT-F1C
  DAT-D1D:
    name: long-running-transaction
    default_severity: MEDIUM
    status: active
    provenance:
    - prior-art
    - gap-review
    - corpus
    recurrence: 2
    examples:
    - Unbounded mass UPDATE in a single transaction holding locks on a hot table
    - Network I/O and thousands of row writes held inside one open transaction
    criteria: >-
      Qualifies when a single transaction is held open across expensive work
      — an unbounded mass UPDATE, or network I/O and thousands of row writes
      before one commit — holding locks on a hot table. An unbounded
      remote-call batch inside one DB transaction routes here (vs C1C for the
      unbounded set alone).
  DAT-E1A:
    name: code-schema-drift-without-migration
    default_severity: HIGH
    status: active
    provenance:
    - prior-art
    - gap-review
    - corpus
    recurrence: 1
    examples:
    - ORM model metadata drifted from migration DDL with no reconciling migration
    criteria: >-
      Qualifies when the code's schema view (ORM model metadata) drifts from
      the migration DDL with no reconciling migration — in EITHER direction:
      code ahead of migrations, or a migration ahead of the model (tests
      permanently diverging from prod). Drift built live via
      metadata.create_all is corroborating.
    see_also:
    - DAT-E1D
  DAT-E1B:
    name: orphaned-rows-on-delete
    default_severity: MEDIUM
    status: active
    provenance:
    - prior-art
    - gap-review
    - corpus
    recurrence: 2
    examples:
    - Multi-step delete leaves index/parent row when a mid-sequence storage step fails
    - Bulk soft-delete bypasses cascade, orphaning child records
    criteria: >-
      Qualifies when a delete leaves rows that should have been removed — a
      multi-step delete where a mid-sequence failure strands a parent/index
      row, or a bulk soft-delete that bypasses the cascade/enqueue that
      removes children.
  DAT-E1C:
    name: soft-delete-inconsistency
    default_severity: MEDIUM
    status: active
    provenance:
    - prior-art
    - gap-review
    - corpus
    recurrence: 4
    examples:
    - Unique constraint does not exclude soft-deleted rows (full-unique vs partial-unique within one schema)
    - Soft-delete tombstones one key column but a non-partial unique constraint still collides on re-create
    - FK ON DELETE CASCADE never fires because the model uses soft delete
    - Accessor filters for soft-deleted rows, inverted vs its sibling queries
    criteria: >-
      Qualifies when soft-delete semantics are applied inconsistently within
      a schema — the cleanest trigger being a unique constraint that does NOT
      exclude soft-deleted rows (full-unique vs partial-unique within one
      soft-delete schema), so recreate-after-delete collides; also an
      accessor filtering for soft-deleted rows (inverted vs siblings), or an
      ON DELETE CASCADE that never fires because the model uses soft delete.
  DAT-E1D:
    name: mirror-source-divergence
    default_severity: MEDIUM
    status: active
    provenance:
    - corpus
    recurrence: 3
    examples:
    - Mirror row stuck at status=open while GitHub says verified-pass, never reconciled
    - Issue mirror silently truncates at --limit 1000 with no partial-mirror warning
    - Mirror fabricates created-at timestamp when source value is missing
    criteria: >-
      Qualifies when a mirror or derived store durably contradicts its
      system-of-record with no reconciliation or self-heal path, so reads serve
      stale/wrong data indefinitely. Includes silent partial mirroring
      (truncation with no warning) and fabricated provenance (substituting
      run-time values for missing source fields).
    see_also:
    - DAT-E1A
  DAT-F1A:
    name: destructive-rewrite-without-backup
    default_severity: HIGH
    status: active
    provenance:
    - corpus
    recurrence: 4
    examples:
    - chezmoi init overwrites hand-edited chezmoi.toml with no backup or prompt
    - Corrupt brew JSON cache silently overwritten with empty {} on next write
    - Truncated strix cli-config.json ignored then clobbered by next persist
    - Empty menu snapshot accepted as truth, soft-deletes every product in one shot
    criteria: >-
      Qualifies when a persisted store's data is overwritten or replaced with
      no snapshot, backup, or prompt, so a mistake or crash is unrecoverable.
      Distinct from DAT-B1A, which is migration-scoped (apply-time data loss
      during a schema migration); F1A is non-migration persistence
      (config/state/cache rewrites). A corrupt-input path that silently
      discards then overwrites recoverable data also qualifies.
    see_also:
    - DAT-B1A
  DAT-F1B:
    name: non-atomic-file-write
    default_severity: MEDIUM
    status: active
    provenance:
    - corpus
    recurrence: 5
    examples:
    - PrusaSlicer ConfigBase::save truncates preset INI in place, no temp+rename
    - Terraform filesystem state written via Seek0/Truncate0 in place, torn on crash
    - Logseq :writeFile page save truncates in place with no atomic replace
    - curl truncates cookie jar in place before temp+rename, zero-length on crash
    criteria: >-
      Qualifies when a persisted file is written via truncate-in-place with no
      temp-file + atomic rename (and no fsync), so a crash or ENOSPC mid-write
      leaves torn, truncated, or zero-length state. This is crash-durability of
      a single writer — distinct from COD-F1A (in-memory concurrency-atomicity
      / races). The presence of a correct atomic-write helper elsewhere in the
      same codebase that this path bypasses is corroborating evidence.
    see_also:
    - DAT-F1C
  DAT-F1C:
    name: lost-update-on-unsynchronized-file
    default_severity: MEDIUM
    status: active
    provenance:
    - corpus
    recurrence: 2
    examples:
    - curl shared cookie jar read-modify-write with no lock loses concurrent writer's cookies
    - Homebrew CacheStoreDatabase read-modify-write without flock loses cache entries
    criteria: >-
      Qualifies when a read-modify-write cycle on a shared flat file uses no
      file lock or atomic replace, so concurrent writers silently lose each
      other's updates. The file analogue of DAT-D1C (which is the
      DB-transaction read-modify-write race, fixed by a transaction /
      optimistic concurrency); F1C is fixed by a file lock (flock/fcntl) or
      atomic rename. Atomic-write that prevents torn files does NOT prevent
      lost updates.
    see_also:
    - DAT-D1C
    - DAT-F1B
  DAT-F2A:
    name: unversioned-persisted-format
    default_severity: MEDIUM
    status: active
    provenance:
    - corpus
    recurrence: 3
    examples:
    - qBittorrent RSS feeds.json has no version field, format sniffed heuristically
    - curl Netscape cookie file has no schema-version header
    - PrusaSlicer INI config persisted with no schema version for cross-version migration
    criteria: >-
      Qualifies when an on-disk or embedded-store format carries no
      schema/format version marker, so format evolution silently misreads or
      corrupts pre-existing files (versions are then sniffed heuristically).
      Applies to flat files and embedded stores (BoltDB/bbolt, on-disk JSON).
    see_also:
    - DAT-F2B
  DAT-F2B:
    name: unbounded-persisted-file-read
    default_severity: LOW
    status: active
    provenance:
    - corpus
    recurrence: 2
    cwe:
    - CWE-789
    examples:
    - qBittorrent reads fastresume file with readFile(-1) unbounded into memory
    - PrusaSlicer loadvector allocates from an unbounded file-supplied element count
    criteria: >-
      Qualifies when a persisted file is read wholly into memory with no size
      bound (or an element count is read from the file and used to allocate
      unchecked), so a crafted or naturally-large file exhausts memory.
      Distinct from SEC-F2A (unbounded read of a network response — different
      sink) and QAL-G2A (in-memory collection growth, not a file read).
    see_also:
    - DAT-F2A
