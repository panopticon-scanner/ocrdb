# OCRDb domain file — INCUBATING (pre-1.0; codes may change until the 1.0 freeze). See CHARTER.md.
domain: QAL
name: quality-maintainability
areas:
  A:
    name: readability
    categories:
      '1': naming
      '2': clarity
  B:
    name: style-and-formatting
    categories:
      '1': imports
      '2': whitespace-and-layout
      '3': string-formatting
  C:
    name: documentation
    categories:
      '1': stale-references
      '2': docs-code-drift
  D:
    name: duplication
    categories:
      '1': duplicated-logic
  E:
    name: dead-code
    categories:
      '1': dead-configuration
      '2': stale-artifacts
      '3': unused-code
  F:
    name: structure-and-convention
    categories:
      '1': import-dependency-structure
      '2': code-placement
      '3': convention-divergence
  G:
    name: efficiency
    categories:
      '1': redundant-computation
      '2': memory-and-scale
  H:
    name: complexity-and-simplification
    categories:
      '1': complexity
      '2': simplification-judgment
  I:
    name: observability
    categories:
      '1': diagnostics
entries:
  QAL-A1B:
    name: inconsistent-naming-convention
    default_severity: INFO
    status: active
    provenance:
    - tool-observed
    character: opportunity
    examples:
    - maintain consistent naming conventions across a module
  QAL-A1C:
    name: name-collision-with-domain-concept
    default_severity: INFO
    status: active
    provenance:
    - corpus
    recurrence: 2
    examples:
    - Filename orchestrator.py collides with the unrelated 'orchestrator' concept used throughout the pipeline docs/agent
      naming
    - Same collision flagged again independently in a later review pass on the same file
  QAL-A2B:
    name: confusing-expression-precedence
    default_severity: LOW
    status: active
    provenance:
    - corpus
    recurrence: 3
    cwe:
    - CWE-1078
    examples:
    - '`"**Found by:** %s%s" % (src, "  \u00b7  model: %s" % prov["model"] if prov.get("model") else "")` reads,
      at a glance, as if the ternary applies to the wrong operand'
    - Awkward line break in a conditional expression obscures which branch a continuation line belongs to
  QAL-A2C:
    name: magic-number-or-fragile-hardcoded-index
    default_severity: LOW
    status: active
    provenance:
    - tool-observed
    - corpus
    recurrence: 4
    examples:
    - title_for() truncates with `room = 240 - len(suffix)`, no comment explaining where 240 comes from
    - render_summary() prepends banner lines via three independent lines.insert(<fixed index>, ...) calls with undocumented,
      fragile hardcoded indices
    character: opportunity
  QAL-A2D:
    name: comment-noise
    default_severity: INFO
    status: active
    provenance:
    - tool-observed
    character: opportunity
    examples:
    - removing comments that describe obvious code
  QAL-B1A:
    name: combined-imports-single-line
    default_severity: LOW
    status: active
    provenance:
    - corpus
    recurrence: 20
    cwe:
    - CWE-1078
    examples:
    - '`import contextlib, io, os, sys, json, tempfile, unittest` violates PEP 8''s one-import-per-line guidance'
    - '`import sys, os` on a single line (PEP 8 E401), inconsistent with every sibling test file''s one-import-per-line
      style'
    automated_by:
    - ruff:E401
  QAL-B1B:
    name: mid-file-or-inline-import-placement
    default_severity: LOW
    status: active
    provenance:
    - corpus
    recurrence: 8
    cwe:
    - CWE-1078
    examples:
    - '`import fnmatch` and `from scripts.tools import ADAPTERS` done inside a function body instead of module top-level,
      unlike the rest of the file'
    - Import statements placed inside test methods rather than at module level
    automated_by:
    - ruff:E402
  QAL-B1C:
    name: redundant-shadowing-import
    default_severity: LOW
    status: active
    provenance:
    - corpus
    recurrence: 11
    cwe:
    - CWE-1041
    examples:
    - '`scripts.evidence` imported twice under two different aliases (`evidence` and `ev`) in the same file, used
      inconsistently across classes'
    - 10+ test methods locally re-import io/contextlib/tempfile that are already imported at module scope
    automated_by:
    - ruff:F811
  QAL-B2A:
    name: line-too-long
    default_severity: LOW
    status: active
    provenance:
    - corpus
    recurrence: 3
    cwe:
    - CWE-1078
    examples:
    - A nested ternary conditional expression spans ~107 characters, exceeding PEP 8's line-length guideline
    - Line exceeds an 88-character limit
    automated_by:
    - ruff:E501
  QAL-B2B:
    name: misaligned-or-awkward-continuation
    default_severity: LOW
    status: active
    provenance:
    - corpus
    recurrence: 2
    cwe:
    - CWE-1078
    examples:
    - Backslash line continuation used instead of implicit (parenthesized) continuation
    - Misaligned continuation line in a tuple return statement
  QAL-B2C:
    name: missing-blank-line-separation
    default_severity: LOW
    status: active
    provenance:
    - corpus
    recurrence: 2
    cwe:
    - CWE-1078
    examples:
    - Missing blank line before a module-level function definition
    - Missing PEP8 two-blank-line separation between top-level definitions
  QAL-B2D:
    name: inconsistent-literal-whitespace
    default_severity: INFO
    status: active
    provenance:
    - corpus
    recurrence: 2
    cwe:
    - CWE-1078
    examples:
    - Dict literals throughout a test file consistently omit whitespace after ':' and ',', breaking from the file's
      dominant formatting style
  QAL-B3A:
    name: inconsistent-diagnostic-prefix-convention
    default_severity: LOW
    status: active
    provenance:
    - corpus
    recurrence: 5
    cwe:
    - CWE-1078
    examples:
    - 'model_resolver.py''s ''WARNING:'' stderr prefix diverges from the package-wide ''<module>: message'' convention
      used by dispatch.py, ingest_tools.py, etc.'
    - load_findings() mixes four different stderr diagnostic-prefix conventions in a dozen lines
  QAL-B3B:
    name: mixed-fstring-percent-formatting
    default_severity: LOW
    status: active
    provenance:
    - corpus
    recurrence: 4
    cwe:
    - CWE-1078
    examples:
    - run_adapters() mixes f-string and %-style diagnostic messages while every sibling function in the same file
      uses %-formatting
    - Mixed f-string and %-formatting used for near-identical diagnostics in one file
  QAL-B3C:
    name: string-concatenation-instead-of-fstring
    default_severity: LOW
    status: active
    provenance:
    - corpus
    recurrence: 1
    cwe:
    - CWE-1078
    examples:
    - String built with the + operator instead of an f-string, inconsistent with the file's dominant idiom
  QAL-C1A:
    name: stale-external-url-reference
    default_severity: MEDIUM
    status: active
    provenance:
    - corpus
    recurrence: 4
    criteria: >-
      Qualifies when a URL or reference in documentation or code is STALE — it
      points to an outdated org, host, or target — as a single per-instance
      staleness defect. Does NOT apply to packaging-manifest URLs (project
      identity), which are ARC-B1C, nor to the same identifier hardcoded across
      multiple modules so copies diverge, which is ARC-E1C (scatter).
    see_also:
    - ARC-B1C
    - ARC-E1C
  QAL-C1B:
    name: inconsistent-ordering-in-docs
    default_severity: LOW
    status: active
    provenance:
    - corpus
    recurrence: 1
    examples:
    - DEVELOPMENT.md's version History list is in neither ascending nor descending order
  QAL-C1C:
    name: stale-file-path-reference
    default_severity: LOW
    status: active
    provenance:
    - corpus
    recurrence: 7
    cwe:
    - CWE-1059
    examples:
    - CODEOWNERS 'CI / security tooling' and 'Schemas and reference data' sections list paths that no longer exist
      post-restructure
    - 'A module docstring''s Usage: line names the wrong path for the script it documents'
  QAL-C1D:
    name: stale-version-number
    default_severity: LOW
    status: active
    provenance:
    - corpus
    recurrence: 5
    cwe:
    - CWE-1059
    examples:
    - pyproject.toml [project].version reads 3.0.0 while the project's actual current version is 4.2.0
    - CHANGELOG.md's only versioned entry doesn't match DEVELOPMENT.md's description of the same version
  QAL-C2A:
    name: schema-or-example-stricter-than-reality
    default_severity: MEDIUM
    status: active
    provenance:
    - corpus
    recurrence: 3
    examples:
    - report-schema.json constrains finding IDs to a 2-4 letter prefix pattern, but the real convention elsewhere
      in the codebase is 2-8 letters
    - A CVE ID format placeholder implies a fixed 6-digit sequence number, imprecise relative to the real CVE ID
      grammar
    criteria: >-
      Qualifies when a schema, example, or placeholder is more precise or strict
      than the real convention but the over-specification is INERT — no valid
      output is actually rejected and nothing breaks (precision hygiene). If a live
      constraint rejects real producer output, that is COD-D1B (correctness); if
      the stricter copy is dead and unimported, QAL-E1B; if the format is defined
      inconsistently across artifacts, ARC-D1D.
    see_also:
    - ARC-D1D
    - COD-D1B
    - QAL-E1B
  QAL-C2B:
    name: self-contradictory-documentation
    default_severity: MEDIUM
    status: active
    provenance:
    - corpus
    recurrence: 1
    examples:
    - SKILL.md's 'Notes' section makes a blanket self-write claim that directly contradicts the Codex and generic-host
      sections of the same file
  QAL-C2C:
    name: cli-docs-out-of-sync-with-implementation
    default_severity: LOW
    status: active
    provenance:
    - corpus
    recurrence: 6
    examples:
    - README Quick Start examples use a --mode/--target CLI syntax that no longer matches the documented flags
    - SKILL.md frontmatter's `arguments` list is stale relative to the much larger, differently-named flag surface
      documented in the body
    criteria: >-
      Qualifies when CLI or flag documentation is STALE relative to an
      implementation that DOES exist — the flags are real but the docs lag,
      misname, or under-cover them (doc hygiene, LOW). If a documented feature is
      entirely unimplemented so a following user breaks, that is COD-D2B; if the
      whole interface contract is structurally unreliable, ARC-D2A.
    see_also:
    - ARC-D2A
    - COD-D2B
  QAL-C2D:
    name: docstring-inaccurate-error-contract
    default_severity: LOW
    status: active
    provenance:
    - corpus
    recurrence: 1
    examples:
    - acquire_pr()'s docstring promises a loud RuntimeError on any failure, but a missing gh/git binary actually
      raises a different, undocumented exception
  QAL-C2E:
    name: typo-in-shipped-text
    default_severity: LOW
    status: active
    provenance:
    - corpus
    recurrence: 1
    examples:
    - Shipped commit-message template contains the typo 'kim port' instead of 'kimi port'
  QAL-C2F:
    name: undocumented-configuration-behavior
    default_severity: LOW
    status: active
    provenance:
    - corpus
    recurrence: 2
    examples:
    - cwe_owasp mapping's intentional sparseness (8 of 34 catalog CWEs unmapped) is undocumented
    - model-profiles.yml's claude host entries silently omit max_context_size/max_output_size present on the other
      two hosts
  QAL-D1A:
    name: duplicated-business-logic-block
    default_severity: MEDIUM
    status: active
    provenance:
    - corpus
    - tool-observed
    recurrence: 7
    cwe:
    - CWE-1041
    examples:
    - run_tools()'s legacy-SARIF and Phase-1-adapter dispatch blocks duplicate ~20 lines of subprocess invoke/error-handling
      logic
    criteria: >-
      Qualifies per-instance when the same block of business logic is duplicated
      and should be consolidated within the existing structure — the finding is
      the copies themselves (a maintainability / DRY smell). When the hazard is
      the STRUCTURAL absence of a shared module or owner that a proper fix must
      create, that is ARC-A3A.
    character: opportunity
    see_also:
    - ARC-A3A
  QAL-D1B:
    name: duplicated-constant-definition
    default_severity: MEDIUM
    status: active
    provenance:
    - corpus
    recurrence: 8
    cwe:
    - CWE-1041
    criteria: >-
      Qualifies per-instance when the same constant is defined in two or more
      places and should be unified — the finding is the duplicate definitions
      themselves. When the hazard is the STRUCTURAL lack of a canonical owner that
      a proper fix must establish (an ownership / aliasing change), that is
      ARC-A5A. A dead, unimported stricter duplicate is instead QAL-E1B.
    see_also:
    - ARC-A5A
    - QAL-E1B
  QAL-D1C:
    name: duplicated-helper-function
    default_severity: MEDIUM
    status: active
    provenance:
    - corpus
    - tool-observed
    recurrence: 10
    cwe:
    - CWE-1041
    examples:
    - load_ledger() and record() are nearly identical, copy-pasted across file_fixmes.py and file_issues.py
    - _severity_class and _panel_class implement the exact same strip/lowercase transform, differing only in a CSS-class
      prefix string
    character: opportunity
  QAL-E1A:
    name: dead-configuration-setting
    default_severity: LOW
    status: active
    provenance:
    - corpus
    recurrence: 2
    cwe:
    - CWE-561
    examples:
    - Ruff's `[tool.ruff.lint.pydocstyle] convention = "google"` is dead configuration because the "D" rule set
      that would consume it is never selected
  QAL-E1B:
    name: unused-duplicate-validator-left-in-code
    default_severity: LOW
    status: active
    provenance:
    - corpus
    recurrence: 4
    cwe:
    - CWE-561
    - CWE-1041
    examples:
    - base.py declares ID_RE, an unused, stricter duplicate of the canonical finding-ID regex actually used in synthesize.py;
      nothing imports or calls it
    criteria: >-
      Qualifies when a duplicated validator, regex, or constant is DEAD — an
      unused, un-imported stricter copy of a canonical rule that has drifted from
      it (dead code plus duplication). If the drifted duplicate is live and rejects
      real output, elevate to COD-D1B; if it is live-but-cosmetic over-precision,
      QAL-C2A; if two live copies simply diverge as a duplication smell, QAL-D1B.
    see_also:
    - ARC-D1D
    - COD-D1B
    - QAL-C2A
    - QAL-D1B
  QAL-E2B:
    name: retired-component-still-registered
    default_severity: MEDIUM
    status: active
    provenance:
    - corpus
    recurrence: 4
    cwe:
    - CWE-561
    examples:
    - '"eslint" stays registered in ADAPTERS as a LegacySarifAdapter after being explicitly retired in the module''s
      own comments'
    - 'sarif_utils.PREFIX still maps "brakeman": "BR" though the only Brakeman findings actually come from the dedicated
      BrakemanAdapter'
    see_also:
    - ARC-A4C
  QAL-E2C:
    name: orphaned-asset-rules
    default_severity: INFO
    status: active
    provenance:
    - tool-observed
    character: defect
    examples:
    - .grades and .heatmap-more CSS classes in html_report.py with no referencing template markup
  QAL-E3A:
    name: dead-code-unused-function
    default_severity: LOW
    status: active
    provenance:
    - tool-observed
    character: defect
    examples:
    - 'run_adapters: no production caller'
    - 'model_resolver.role_config: zero callers'
    notes: receiving-code-review treats unused/dead code as a YAGNI defect, not merely an opportunity — character
      is contested across sources
  QAL-F1A:
    name: implicit-sys-path-or-import-dependency
    default_severity: MEDIUM
    status: active
    provenance:
    - corpus
    recurrence: 12
    examples:
    - group_runner.py imports scripts.evidence without ensuring the parent directory is on sys.path, relying implicitly
      on the caller's setup
    - Two incompatible sys.path bootstrap conventions coexist in the test suite, making import success order-dependent
  QAL-F1B:
    name: inconsistent-import-style-across-modules
    default_severity: MEDIUM
    status: active
    provenance:
    - corpus
    recurrence: 5
    cwe:
    - CWE-1099
    examples:
    - Adapter modules use inconsistent import patterns from one file to the next
    - unittest.mock.patch used without importing the mock submodule, an inconsistent stderr-capture idiom relative
      to sibling tests
  QAL-F2A:
    name: logic-embedded-in-non-standard-location
    default_severity: LOW
    status: active
    provenance:
    - corpus
    recurrence: 1
    examples:
    - Gate logic is embedded as an inline Python heredoc inside the CI workflow YAML instead of living in a reusable,
      unit-tested script
  QAL-F2B:
    name: main-guard-or-block-misplaced-mid-file
    default_severity: LOW
    status: active
    provenance:
    - corpus
    recurrence: 3
    cwe:
    - CWE-1078
    examples:
    - Main block misplaced in the middle of a file rather than at the end
    criteria: >-
      Qualifies ONLY when a misplaced `__main__` guard (or top-level block) is
      purely cosmetic — every definition after it still collects and executes
      identically, so there is no reachability or discovery impact (layout
      hygiene, LOW). If production code after the guard becomes unreachable, that
      is COD-E2A; if test classes after it are silently dropped from discovery,
      TST-C1A.
    see_also:
    - COD-E2A
    - TST-C1A
  QAL-F3B:
    name: inconsistent-noqa-annotation-usage
    default_severity: LOW
    status: active
    provenance:
    - corpus
    recurrence: 6
    examples:
    - Bare except Exception blocks in orchestrator.py omit the codebase's noqa:BLE001 tolerant-by-design convention
      used elsewhere for the same pattern
    - '# noqa suppressions on identical `class R:` test-double patterns are applied inconsistently within the same
      file'
    automated_by:
    - ruff:RUF100
  QAL-F3C:
    name: inconsistent-per-host-field-naming
    default_severity: INFO
    status: active
    provenance:
    - corpus
    recurrence: 1
    cwe:
    - CWE-1099
    examples:
    - model-profiles.yml uses a different field-naming convention for model/effort settings depending on which host
      section it's in
  QAL-F3D:
    name: partial-type-hint-adoption
    default_severity: INFO
    status: active
    provenance:
    - tool-observed
    - corpus
    recurrence: 4
    examples:
    - select_adapters() and run_adapters() carry full PEP 484 type annotations while most other functions in the
      same file have none, with no apparent rule for which get them
    character: opportunity
  QAL-G1A:
    name: loop-invariant-not-hoisted
    default_severity: LOW
    status: active
    provenance:
    - tool-observed
    character: opportunity
    examples:
    - eligible_ids set recomputed inside synthesize's per-group loop despite being loop-invariant
  QAL-G1B:
    name: missing-memoization
    default_severity: LOW
    status: active
    provenance:
    - tool-observed
    character: opportunity
    examples:
    - dispatch.load_template re-read and re-parsed advisor.md once per verify-queue entry — 412 times in run-3
    - synthesize re-loading CWE catalog and verdicts per call site instead of threading loaded values
  QAL-G1C:
    name: repeated-filesystem-stat
    default_severity: LOW
    status: active
    provenance:
    - tool-observed
    character: opportunity
    examples:
    - orchestrator._within recomputed os.path.realpath(repo) per candidate file on large expansions; cached via
      _repo_realpath
  QAL-G2A:
    name: unbounded-collection-load
    default_severity: MEDIUM
    status: active
    provenance:
    - prior-art
    cwe:
    - CWE-400
    character: defect
  QAL-H1A:
    name: overly-complex-function
    default_severity: MEDIUM
    status: active
    provenance:
    - tool-observed
    character: opportunity
    examples:
    - function flagged for high cyclomatic complexity / too many responsibilities combined into one function
  QAL-H1B:
    name: excess-nesting-complexity
    default_severity: LOW
    status: active
    provenance:
    - tool-observed
    character: opportunity
    examples:
    - nested ternary operators flagged for conversion to switch/if-else chains
    - reducing unnecessary complexity and nesting
  QAL-H2A:
    name: harmful-oversimplification
    default_severity: MEDIUM
    status: active
    provenance:
    - tool-observed
    character: defect
    examples:
    - removing a helpful abstraction that improves organization
    - combining too many concerns into a single function to save lines
    - prioritizing fewer-lines over readability (dense one-liners, nested ternaries) making code harder to debug
      or extend
  QAL-H2B:
    name: correctness-entangled-duplication-deferred
    default_severity: LOW
    status: active
    provenance:
    - tool-observed
    character: opportunity
    examples:
    - 'eslint _strip_prefix vs sarif_utils._norm_uri: two normalization functions look mergeable but intersect an
      open correctness finding, so unification was explicitly deferred out of a quality-only PR'
    - 'reconcile.load_report / file_issues parts-merge unification deferred: duplicated confinement logic entangled
      with an open reconcile-fingerprint correctness finding'
  QAL-H2C:
    name: needless-abstraction
    default_severity: LOW
    status: active
    provenance:
    - tool-observed
    character: opportunity
    examples:
    - eliminating redundant code and abstractions
    - removing indirection that adds no value beyond direct derivation
  QAL-I1A:
    name: missing-trace-context-propagation
    default_severity: LOW
    status: active
    provenance:
    - prior-art
    - gap-review
  QAL-I1B:
    name: vague-log-message-without-context
    default_severity: INFO
    status: active
    provenance:
    - prior-art
    - gap-review
    cwe:
    - CWE-778
