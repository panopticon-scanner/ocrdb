# OCRDb domain file — INCUBATING (pre-1.0): no domain is ratified until 1.0; this domain's lifecycle stage is derived, not stored here — see RATIFICATION.md.
domain: ACC
name: accessibility
areas:
  A:
    name: semantics
    categories:
      '1': accessible-names
  B:
    name: keyboard
    categories:
      '1': keyboard-operability
  C:
    name: forms
    categories:
      '1': form-labeling
  D:
    name: live-regions
    categories:
      '1': dynamic-announcements
  E:
    name: contrast
    categories:
      '1': perceivable-distinction
  F:
    name: motion
    categories:
      '1': motion-preferences
entries:
  ACC-A1A:
    name: icon-only-control-missing-accessible-name
    default_severity: HIGH
    status: active
    provenance:
    - corpus
    recurrence: 52
    criteria: >-
      Qualifies when a control exposes no programmatic accessible name to
      assistive technology, violating WCAG 4.1.2 Name, Role, Value.
      A user relying on a screen reader cannot identify the control's purpose.
    examples:
    - icon-only-control-missing-accessible-name
    - icon-only-button-missing-accessible-name
  ACC-A1B:
    name: non-text-content-missing-alternative
    default_severity: MEDIUM
    status: active
    provenance:
    - corpus
    recurrence: 20
    criteria: >-
      Qualifies when non-text content (image, icon, chart, media) conveys
      information but exposes no text alternative, so assistive-technology
      users lose it, violating WCAG 1.1.1 Non-text Content. Distinct from a
      control missing an accessible name (ACC-A1A); this is informational
      content, not an operable control.
    examples:
    - image-missing-alt-text
    - non-text-content-missing-text-alternative
  ACC-B1A:
    name: non-interactive-element-used-as-control
    default_severity: HIGH
    status: active
    provenance:
    - corpus
    recurrence: 32
    criteria: >-
      Qualifies when a div/span or other non-interactive element is wired as
      a control without role and keyboard operability, violating WCAG 2.1.1
      Keyboard. Keyboard and assistive-technology users cannot operate the
      control.
    examples:
    - div-clickable-lacks-role-and-tabindex
    - non-interactive-element-used-as-control
  ACC-B1B:
    name: focus-indicator-suppressed
    default_severity: MEDIUM
    status: active
    provenance:
    - corpus
    recurrence: 18
    criteria: >-
      Qualifies when the keyboard focus indicator is removed (e.g.
      outline:none) with no visible replacement, so keyboard users cannot see
      which element has focus, violating WCAG 2.4.7 Focus Visible. Distinct
      from a non-interactive element wired as a control (ACC-B1A); here the
      control is focusable but focus is invisible.
    examples:
    - focus-indicator-suppressed
    - outline-none-without-replacement
  ACC-C1A:
    name: input-missing-programmatic-label
    default_severity: MEDIUM
    status: active
    provenance:
    - corpus
    recurrence: 22
    criteria: >-
      Qualifies when a form input has no programmatically associated label (no
      <label for>, aria-label, or aria-labelledby), so assistive technology
      cannot announce the field's purpose, violating WCAG 1.3.1 and 4.1.2. The
      form-field form of a missing accessible name; a non-form control missing
      its name is ACC-A1A.
    examples:
    - form-input-label-not-programmatically-associated
    - placeholder-used-as-label
  ACC-D1A:
    name: dynamic-status-not-announced
    default_severity: MEDIUM
    status: active
    provenance:
    - corpus
    recurrence: 10
    criteria: >-
      Qualifies when a dynamic status change (validation error, toast, async
      result) updates the DOM without a live region (aria-live /
      role=status|alert), so screen-reader users are never notified, violating
      WCAG 4.1.3 Status Messages. Distinct from a static missing name
      (ACC-A1A); this is unannounced runtime change.
    examples:
    - status-toast-not-announced
    - dynamic-region-missing-aria-live
  ACC-E1A:
    name: info-conveyed-by-color-alone
    default_severity: LOW
    status: active
    provenance:
    - corpus
    recurrence: 11
    criteria: >-
      Qualifies when color is the only visual means of conveying information,
      indicating an action, or distinguishing an element (e.g. red-only error
      text), so users who cannot perceive the color lose the information,
      violating WCAG 1.4.1 Use of Color.
    examples:
    - selection-state-color-only
    - error-conveyed-by-color-alone
  ACC-F1A:
    name: motion-ignores-reduced-motion-preference
    default_severity: LOW
    status: active
    provenance:
    - corpus
    recurrence: 9
    criteria: >-
      Qualifies when non-essential animation runs without honoring the user's
      reduced-motion preference (prefers-reduced-motion), risking discomfort
      for motion-sensitive users, per WCAG 2.3.3 Animation from Interactions.
    examples:
    - animation-ignores-prefers-reduced-motion
    - autoplay-motion-no-user-control
