    criteria: Qualifies when a security invariant in production code is enforced only by assert (stripped
      under python -O, disabled in release/NDEBUG builds), so the check disappears in optimized runs (CWE-617).
      Asserts in test code do not qualify. A policy that is stated but not enforced in code at all is ARC-F1E.
    see_also:
    - ARC-F1E
    - SEC-G3B
    - TST-G2E
    severity_range:
      floor: LOW
      ceiling: MEDIUM
      raise_when:
      - to: MEDIUM
        condition: the production deployment is shown to run optimized (python -O, PYTHONOPTIMIZE set, NDEBUG
          release build), so the check is absent today
  SEC-G3D:
    name: missing-vulnerability-disclosure-policy
    default_severity: INFO
    status: active
    provenance:
    - corpus
    recurrence: 1
    examples:
    - No SECURITY.md backing the vulnerability-disclosure instruction
    criteria: Qualifies when a project that ships software has no vulnerability-disclosure policy (a SECURITY.md
      or equivalent contact and process). When documentation promises a disclosure process whose backing file
      is absent, that is the doc-versus-repo gap ARC-D3B; cite one code, not both.
    see_also:
    - ARC-D3B
    severity_range:
      floor: INFO
      ceiling: INFO
  SEC-H1A:
    name: session-fixation
    default_severity: HIGH
    status: active
    provenance:
    - prior-art
    - asvs-align
    cwe:
    - CWE-384
    criteria: Qualifies when the session identifier is not regenerated on authentication or privilege change,
      so a pre-set id that an attacker planted becomes authenticated (CWE-384). Missing cookie flags are SEC-H1B.
      No idle or absolute expiry is SEC-H1C.
    see_also:
    - SEC-H1B
    - SEC-H1C
    severity_range:
      floor: MEDIUM
      ceiling: HIGH
      lower_when:
      - to: MEDIUM
        condition: the framework rejects session ids supplied from outside (no URL or adoption of unknown
          ids), so planting one needs a separate XSS or subdomain foothold
  SEC-H1B:
    name: missing-secure-cookie-flags
    default_severity: MEDIUM
    status: active
    provenance:
    - prior-art
    - asvs-align
    cwe:
    - CWE-614
    criteria: Qualifies when a session or auth cookie lacks Secure, HttpOnly, or a suitable SameSite attribute
      (CWE-614/1004). Missing CSRF tokens are SEC-H2A, where SameSite is a compensating control. Missing expiry
      is SEC-H1C.
    see_also:
    - SEC-H1A
    - SEC-H2A
    severity_range:
      floor: LOW
      ceiling: MEDIUM
      lower_when:
      - to: LOW
        condition: the only missing attribute is Secure on a host served solely over HTTPS with HSTS preload,
          or the only missing attribute is SameSite and token-based CSRF protection is present
  SEC-H1C:
    name: missing-session-expiry
    default_severity: MEDIUM
    status: active
    provenance:
    - prior-art
    - asvs-align
    cwe:
    - CWE-613
    criteria: Qualifies when server-side sessions or refresh tokens have no idle or absolute timeout, or are
      not invalidated on logout or password change (CWE-613). JWT exp/aud not being validated is SEC-H3C.
      Fixation is SEC-H1A.
    see_also:
    - SEC-H1A
    - SEC-H3C
    severity_range:
      floor: LOW
      ceiling: MEDIUM
      lower_when:
      - to: LOW
        condition: an idle timeout and logout invalidation exist and only the absolute lifetime cap is missing
  SEC-H2A:
    name: csrf-missing-token-protection
    default_severity: HIGH
    status: active
    provenance:
    - prior-art
    - owasp-align
    cwe:
    - CWE-352
    criteria: Qualifies when a state-changing endpoint authenticated by ambient credentials (cookies) accepts
      cross-site requests with no anti-CSRF token, origin check, or SameSite protection (CWE-352), including
      a missing OAuth state parameter. A permissive CORS policy is SEC-H2B. A cookie missing SameSite on its
      own is SEC-H1B.
    see_also:
    - SEC-H1B
    - SEC-H2B
    - SEC-H3B
    severity_range:
      floor: MEDIUM
      ceiling: HIGH
      lower_when:
      - to: MEDIUM
        condition: the forgeable state change is limited to non-sensitive user preferences (no credentials,
          payments, permissions, or data deletion)
  SEC-H2B:
    name: cors-misconfiguration
    default_severity: MEDIUM
    status: active
    provenance:
    - prior-art
    cwe:
    - CWE-942
    criteria: Qualifies when a CORS policy reflects arbitrary origins, allows null, or uses wildcard or regex
      origins together with credentials, so a hostile site can read authenticated responses (CWE-942). Missing
      CSRF protection is SEC-H2A.
    see_also:
    - SEC-H2A
    severity_range:
      floor: LOW
      ceiling: HIGH
      raise_when:
      - to: HIGH
        condition: 'an arbitrary origin is reflected together with Access-Control-Allow-Credentials: true
          on endpoints that return user data'
      lower_when:
      - to: LOW
        condition: the permissive policy covers only unauthenticated, public, read-only endpoints and credentials
          are not allowed
  SEC-H2C:
    name: open-redirect
    default_severity: MEDIUM
    status: active
    provenance:
    - prior-art
    cwe:
    - CWE-601
    criteria: 'Qualifies when a server endpoint redirects to a URL taken from request input with no allow-list
      (CWE-601). An OAuth redirect_uri validation gap is SEC-H3B. A javascript: link in rendered content is
      SEC-B1B. A redirect used to launder an SSRF fetch is cited at SEC-D2A.'
    see_also:
    - SEC-B1B
    - SEC-D2A
    - SEC-H3B
    severity_range:
      floor: MEDIUM
      ceiling: HIGH
      raise_when:
      - to: HIGH
        condition: the redirect carries tokens, codes, or session material in the URL to the host the attacker
          chose
  SEC-H2D:
    name: missing-frame-protection-clickjacking
    default_severity: LOW
    status: active
    provenance:
    - prior-art
    cwe:
    - CWE-1021
    criteria: Qualifies when a served page with state-changing UI sends neither X-Frame-Options nor a CSP
      frame-ancestors directive (CWE-1021). A missing CSP in a static generated report is SEC-B1E.
    see_also:
    - SEC-B1E
    severity_range:
      floor: LOW
      ceiling: MEDIUM
      raise_when:
      - to: MEDIUM
        condition: the frameable page performs a sensitive one-click action (payment, permission grant, account
          deletion)
  SEC-H3A:
    name: jwt-algorithm-confusion
    default_severity: HIGH
    status: active
    provenance:
    - prior-art
    cwe:
    - CWE-347
    criteria: Qualifies when JWT verification accepts the algorithm from the token header (alg=none, or HS256
      verified with an RSA public key used as the HMAC secret) instead of an algorithm pinned on the server
      (CWE-347). Missing exp/aud/iss checks are SEC-H3C.
    see_also:
    - SEC-C3B
    - SEC-H3C
    severity_range:
      floor: HIGH
      ceiling: CRITICAL
      raise_when:
      - to: CRITICAL
        condition: alg=none or key confusion is accepted on tokens that authenticate internet-facing requests
          (forgery needs no key)
  SEC-H3B:
    name: oauth-redirect-uri-validation-gap
    default_severity: HIGH
    status: active
    provenance:
    - prior-art
    cwe:
    - CWE-601
    criteria: Qualifies when an OAuth/OIDC authorization server or client matches redirect_uri by prefix,
      substring or wildcard, or skips matching against the registration, so authorization codes or tokens
      can be delivered to an attacker's host (CWE-601). A general application open redirect is SEC-H2C. A
      missing OAuth state parameter is SEC-H2A.
    see_also:
    - SEC-H2A
    - SEC-H2C
    severity_range:
      floor: MEDIUM
      ceiling: HIGH
      lower_when:
      - to: MEDIUM
        condition: PKCE is enforced for every client and no response type that returns tokens in the redirect
          (implicit or hybrid flow) is enabled, so an intercepted redirect yields only an unredeemable code
  SEC-H3C:
    name: jwt-missing-expiry-or-audience-validation
    default_severity: MEDIUM
    status: active
    provenance:
    - prior-art
    cwe:
    - CWE-613
    criteria: Qualifies when JWT validation skips the exp/nbf, audience or issuer checks, so expired tokens,
      or tokens minted for another service, are accepted (CWE-613). Accepting an algorithm chosen by the header
      is SEC-H3A. Server-side session expiry is SEC-H1C.
    see_also:
    - SEC-H1C
    - SEC-H3A
    severity_range:
      floor: MEDIUM
      ceiling: HIGH
      raise_when:
      - to: HIGH
        condition: the audience is unchecked and the same issuer and key sign tokens for other services or
          tenants, so cross-service replay is possible
  SEC-H4A:
    name: redos-catastrophic-backtracking
    default_severity: MEDIUM
    status: active
    provenance:
    - prior-art
    cwe:
    - CWE-1333
    criteria: Qualifies when a regex with nested or overlapping quantifiers (catastrophic backtracking) runs
      on attacker-controlled input with a backtracking engine (CWE-1333). A regex that rejects valid input
      is COD-C2C. Unbounded input size alone is SEC-H4B.
    see_also:
    - COD-C2C
    - SEC-H4B
    severity_range:
      floor: LOW
      ceiling: HIGH
      raise_when:
      - to: HIGH
        condition: a single unauthenticated request is measured to block a worker past the service's request
          timeout, and no per-match timeout exists, so a few concurrent requests exhaust the worker pool
      lower_when:
      - to: LOW
        condition: the measured worst-case match time at the enforced maximum input length is under about
          100 ms (e.g. polynomial-only backtracking with a tight length cap)
  SEC-H4B:
    name: unbounded-request-size
    default_severity: MEDIUM
    status: active
    provenance:
    - prior-art
    cwe:
    - CWE-400
    criteria: Qualifies when an inbound request body, upload, header or decompressed payload is accepted with
      no size limit, so an attacker can exhaust memory or disk (CWE-400; zip and gzip bombs included). An
      outbound response read with no bound is SEC-F2A. Internal load or capacity is OPS-D1A. A persisted file
      read whole is DAT-F2B.
    see_also:
    - DAT-F2B
    - OPS-D1A
    - SEC-F2A
    - SEC-H4A
    severity_range:
      floor: MEDIUM
      ceiling: HIGH
      raise_when:
      - to: HIGH
        condition: the payload is decompressed with no size or ratio limit on an unauthenticated endpoint
          (a decompression bomb is possible)
