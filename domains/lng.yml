# OCRDb domain file — INCUBATING (pre-1.0; codes may change until the 1.0 freeze). See CHARTER.md.
domain: LNG
name: language-and-internationalization
areas:
  A:
    name: externalization
    categories:
      '1': string-externalization
  B:
    name: locale-formatting
    categories:
      '1': locale-aware-formatting
  C:
    name: grammar
    categories:
      '1': translation-composition
  D:
    name: key-drift
    categories:
      '1': key-management
  E:
    name: encoding
    categories:
      '1': text-encoding
  F:
    name: directionality
    categories:
      '1': directionality
entries:
  LNG-A1A:
    name: hardcoded-user-facing-string
    default_severity: MEDIUM
    status: active
    provenance:
    - corpus
    recurrence: 59
    criteria: >-
      Qualifies when a user-facing string is embedded in code, bypassing the
      i18n layer. A user-facing string hardcoded at point-of-use (a prompt,
      label, or message) cannot be translated and will not adapt to locale
      settings, violating i18n externalization principles.
    examples:
    - hardcoded-user-facing-string
    - hardcoded-ui-strings-bypassing-i18n
  LNG-A1B:
    name: string-assembled-outside-i18n
    default_severity: LOW
    status: active
    provenance:
    - corpus
    recurrence: 22
    criteria: >-
      Qualifies when a user-facing string is built by interpolation or
      concatenation outside the i18n layer, so the composed message is never a
      single translatable unit (i18n externalization). Distinct from a fully
      hardcoded literal (LNG-A1A); the grammatical breakage of concatenating
      already-translated fragments is LNG-C1A.
    examples:
    - user-facing-string-dispatched-outside-template
    - label-built-in-code-not-catalog
  LNG-B1A:
    name: locale-unaware-number-date-format
    default_severity: LOW
    status: active
    provenance:
    - corpus
    recurrence: 25
    criteria: >-
      Qualifies when a number, date, time, or currency uses hardcoded
      separators/patterns instead of locale-aware formatting (CLDR/ICU), so
      output is wrong or confusing in other locales. Distinct from
      pluralization (LNG-B1B).
    examples:
    - locale-unaware-date-formatting
    - hardcoded-number-format
  LNG-B1B:
    name: naive-pluralization
    default_severity: LOW
    status: active
    provenance:
    - corpus
    recurrence: 15
    criteria: >-
      Qualifies when plurals use a naive rule (e.g. n==1 else add 's'),
      ignoring the target language's CLDR plural categories
      (zero/one/two/few/many/other), so many locales render grammatically
      wrong counts. Distinct from number/date formatting (LNG-B1A).
    examples:
    - naive-plural-s-suffix
    - count-based-if-else-plural
  LNG-C1A:
    name: translation-assembled-by-concatenation
    default_severity: MEDIUM
    status: active
    provenance:
    - corpus
    recurrence: 19
    criteria: >-
      Qualifies when a sentence is built by concatenating separately
      translated fragments or interpolating values into split strings, so word
      order, gender, and agreement break in languages that differ from the
      source (i18n message grammar). Distinct from bypassing i18n entirely
      (LNG-A1B); here fragments are translated but composed ungrammatically.
    examples:
    - concatenated-translation-fragments
    - sentence-built-by-string-glue
  LNG-D1A:
    name: translation-key-drift-or-missing-fallback
    default_severity: LOW
    status: active
    provenance:
    - corpus
    recurrence: 12
    criteria: >-
      Qualifies when translation keys drift out of sync with the catalog — a
      referenced key is missing with no fallback, or a renamed/unused key
      lingers — so users see a raw key or blank instead of text (i18n catalog
      integrity). The key-lifecycle form; a string that never entered the
      catalog is LNG-A1A.
    examples:
    - translation-key-drift
    - missing-locale-fallback
  LNG-E1A:
    name: byte-vs-codepoint-length-confusion
    default_severity: LOW
    status: active
    provenance:
    - corpus
    recurrence: 6
    criteria: >-
      Qualifies when text is measured, truncated, or indexed by bytes or
      UTF-16 code units as if they were characters, so
      multi-byte/surrogate/grapheme text is split mid-character or mis-limited
      (Unicode handling; CWE-176). The user-facing-text form; raw
      data-layer/serialization encoding homes in DAT (see routing note).
    cwe:
    - CWE-176
    examples:
    - utf8-byte-length-conflated-with-char-count
    - unnormalized-utf8-path-handling
  LNG-F1A:
    name: missing-rtl-bidi-support
    default_severity: LOW
    status: active
    provenance:
    - corpus
    recurrence: 6
    criteria: >-
      Qualifies when the UI assumes left-to-right layout and direction
      (hardcoded left/right, no dir attribute or logical CSS properties), so
      right-to-left languages (Arabic, Hebrew) render mirrored or bidi-broken
      (Unicode Bidirectional Algorithm; CSS logical properties).
    examples:
    - rtl-layout-support-missing
    - bidi-directionality-assumption
